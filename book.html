<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>الكتاب · رفيق المسلم</title>
<meta name="theme-color" content="#fbf7ef">
<link rel="manifest" href="./manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Scheherazade+New:wght@400;500;600;700&family=Reem+Kufi:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
(function(){
  var m='light';
  try{
    var q=new URLSearchParams(location.search).get('theme');
    var g=localStorage.getItem('rm_theme');
    m=q||g||'light';
  }catch(e){}
  if(m!=='dark') m='light';
  document.documentElement.setAttribute('data-theme',m==='dark'?'dark':'');
  document.documentElement.setAttribute('data-mode',m);
})();
</script>
<style>
:root{
  --bg:#fbf7ef; --bg2:#f4ecdc; --paper:#fffdf8; --ink:#2b2115; --ink-soft:#5d4c33; --ink-mute:#8a7758;
  --emerald:#0f5d43; --emerald-2:#178a63; --gold:#a37813; --gold-soft:#c9a227; --gold-line:rgba(163,120,19,.28);
  --accent:#8d2b2b; --line:rgba(163,120,19,.22); --line-strong:rgba(163,120,19,.45);
  --glass:rgba(255,255,255,.72); --glass-2:rgba(255,255,255,.55);
  --shadow:0 8px 30px rgba(120,88,23,.10); --shadow-lg:0 18px 60px rgba(120,88,23,.16);
  --fs:20px; --lh:2.05; --radius:18px;
  --font-q:'Amiri','Scheherazade New',serif; --font-b:'Scheherazade New','Amiri',serif;
  --font-d:'Reem Kufi','Cairo',sans-serif; --font-ui:'Reem Kufi','Tajawal',sans-serif;
}
html[data-theme="dark"]{
  --bg:#080e1a; --bg2:#0d1626; --paper:#111c2e; --ink:#ece7db; --ink-soft:#c3baa7; --ink-mute:#8d8677;
  --emerald:#5ad6a4; --emerald-2:#2fa87a; --gold:#e8c260; --gold-soft:#f5d783; --gold-line:rgba(232,194,96,.3);
  --accent:#e8837a; --line:rgba(232,194,96,.18); --line-strong:rgba(232,194,96,.4);
  --glass:rgba(19,31,49,.72); --glass-2:rgba(19,31,49,.55);
  --shadow:0 8px 30px rgba(0,0,0,.45); --shadow-lg:0 18px 60px rgba(0,0,0,.6);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  font-family:var(--font-b);background:var(--bg);color:var(--ink);line-height:var(--lh);font-size:var(--fs);
  overflow-x:hidden;transition:background .35s,color .35s;
  background-image:
    radial-gradient(900px 500px at 12% -8%,rgba(201,162,39,.16),transparent 62%),
    radial-gradient(800px 500px at 92% 4%,rgba(15,93,67,.10),transparent 60%);
  background-attachment:fixed;
}
html[data-theme="dark"] body{background-image:radial-gradient(900px 520px at 12% -8%,rgba(232,194,96,.10),transparent 62%),radial-gradient(900px 520px at 92% 6%,rgba(45,168,122,.10),transparent 60%)}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.45;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140' viewBox='0 0 140 140'><g fill='none' stroke='%23a37813' stroke-opacity='.13' stroke-width='1.1'><path d='M70 8 L132 70 L70 132 L8 70 Z'/><circle cx='70' cy='70' r='20'/><path d='M70 50 L90 70 L70 90 L50 70 Z'/></g></svg>");
  background-size:140px 140px;
}
html[data-theme="dark"] body::before{opacity:.25}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
::selection{background:rgba(201,162,39,.32)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--gold-line);border-radius:8px}

#bar{position:fixed;top:0;right:0;left:0;height:3px;z-index:60}
#barFill{height:100%;width:0;background:linear-gradient(90deg,var(--emerald),var(--gold-soft));box-shadow:0 0 10px var(--gold-line)}
header{
  position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:8px;padding:10px 14px;
  background:var(--glass);backdrop-filter:blur(16px) saturate(1.2);border-bottom:1px solid var(--line);
  box-shadow:0 4px 24px rgba(120,88,23,.06);
}
.hbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;min-width:38px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink-soft);font-family:var(--font-ui);font-size:.8rem;font-weight:600;transition:.2s;white-space:nowrap}
.hbtn:hover{border-color:var(--line-strong);color:var(--ink);transform:translateY(-1px);box-shadow:var(--shadow)}
.hbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2}
.hbtn.icon{padding:0}
.brand{display:flex;flex-direction:column;align-items:center;gap:1px;flex:1;min-width:0;cursor:pointer}
.brand b{font-family:var(--font-d);font-size:1.05rem;color:var(--emerald);line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.brand span{font-family:var(--font-ui);font-size:.62rem;color:var(--ink-mute);letter-spacing:.4px}
html[data-theme="dark"] .brand b{color:var(--gold)}

#cover{position:relative;z-index:1;min-height:calc(100vh - 60px);display:flex;align-items:center;justify-content:center;padding:34px 18px 60px}
.cover-card{position:relative;width:min(760px,100%);padding:clamp(24px,5vw,58px) clamp(18px,5vw,54px);text-align:center;background:var(--glass);backdrop-filter:blur(20px);border:1.5px solid var(--gold-line);border-radius:26px;box-shadow:var(--shadow-lg)}
.cover-card::before{content:"";position:absolute;inset:9px;border:1px solid var(--line);border-radius:18px;pointer-events:none}
.cover-card::after{content:"۞";position:absolute;bottom:-17px;left:50%;transform:translateX(-50%);width:34px;height:34px;background:var(--bg);color:var(--gold);font-size:20px;line-height:32px;border:1px solid var(--line);border-radius:50%}
.bismillah{font-family:var(--font-q);font-size:clamp(1.2rem,3.4vw,1.7rem);color:var(--emerald);margin-bottom:14px}
html[data-theme="dark"] .bismillah{color:var(--gold-soft)}
.orn{color:var(--gold);letter-spacing:10px;font-size:1rem;opacity:.8;margin:6px 0 4px}
.cover-title{font-family:var(--font-d);font-size:clamp(2.2rem,7.6vw,4.1rem);line-height:1.3;margin:6px 0 2px;background:linear-gradient(120deg,var(--emerald),var(--gold) 55%,var(--emerald));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 10px rgba(163,120,19,.18))}
html[data-theme="dark"] .cover-title{background:linear-gradient(120deg,var(--gold-soft),#fff5cf 45%,var(--gold));-webkit-background-clip:text;background-clip:text}
.cover-sub{font-family:var(--font-q);font-size:clamp(1rem,2.6vw,1.2rem);color:var(--ink-soft);margin-top:6px;line-height:1.9}
.cover-author{font-family:var(--font-d);font-size:clamp(.95rem,2.2vw,1.15rem);color:var(--gold);margin-top:8px;letter-spacing:.2px}
.cover-note2{font-family:var(--font-ui);font-size:.72rem;color:var(--ink-mute);margin-top:16px;line-height:1.9}
.cover-meta{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:22px 0 6px}
.meta{flex:1 1 120px;min-width:104px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--glass-2)}
.meta b{display:block;font-family:var(--font-ui);font-size:1.10rem;color:var(--gold);line-height:1.4}
.meta span{font-family:var(--font-ui);font-size:.7rem;color:var(--ink-mute)}
.cover-cta{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:22px}
.cta{display:inline-flex;align-items:center;gap:8px;padding:13px 26px;border-radius:999px;font-family:var(--font-ui);font-size:.92rem;font-weight:700;transition:.22s;border:1.5px solid transparent}
.cta.primary{background:linear-gradient(135deg,var(--emerald),var(--emerald-2));color:#fff;box-shadow:0 8px 26px rgba(15,93,67,.28)}
.cta.primary:hover{transform:translateY(-2px);box-shadow:0 12px 34px rgba(15,93,67,.36)}
.cta.ghost{border-color:var(--gold-line);color:var(--gold);background:var(--paper)}
.cta.ghost:hover{background:var(--gold);color:#fff;border-color:var(--gold)}

#reader{position:relative;z-index:1;display:none}
#reader.on{display:block}
.layout{display:flex;align-items:flex-start;max-width:1440px;margin:0 auto}
aside{position:sticky;top:59px;width:330px;flex:0 0 330px;height:calc(100vh - 59px);overflow-y:auto;border-left:1px solid var(--line);background:var(--glass);backdrop-filter:blur(14px);padding:14px 10px 40px}
aside h3{font-family:var(--font-d);font-size:1.05rem;color:var(--emerald);padding:6px 10px 10px;display:flex;justify-content:space-between;align-items:center}
html[data-theme="dark"] aside h3{color:var(--gold)}
aside h3 em{font-family:var(--font-ui);font-style:normal;font-size:.68rem;color:var(--ink-mute)}
#idxSearch{width:100%;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-family:var(--font-ui);font-size:.8rem;margin-bottom:10px}
.part-title{font-family:var(--font-ui);font-size:.7rem;letter-spacing:1px;color:var(--gold);margin:14px 10px 6px;padding-bottom:6px;border-bottom:1px dashed var(--line);display:flex;gap:6px;align-items:center}
.ch{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:10px;font-size:.82rem;line-height:1.6;color:var(--ink-soft);cursor:pointer;border:1px solid transparent;transition:.15s;font-family:var(--font-b)}
.ch:hover{background:var(--bg2);color:var(--ink);border-color:var(--line)}
.ch.active{background:linear-gradient(90deg,rgba(15,93,67,.14),rgba(201,162,39,.14));color:var(--emerald);font-weight:700;border-color:var(--gold-line)}
html[data-theme="dark"] .ch.active{color:var(--gold-soft)}
.ch i{flex:0 0 26px;height:20px;border-radius:6px;background:var(--bg2);color:var(--gold);font-family:var(--font-ui);font-size:.66rem;font-style:normal;display:flex;align-items:center;justify-content:center;margin-top:2px}
.ch.done i{background:var(--emerald);color:#fff}
.ch b{font-weight:inherit;flex:1}
main{flex:1;min-width:0;padding:22px clamp(14px,3vw,40px) 90px}
.chapter{max-width:860px;margin:0 auto 26px;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:clamp(20px,3.4vw,42px);box-shadow:var(--shadow);position:relative;overflow:hidden}
.chapter::before{content:"";position:absolute;top:0;right:0;left:0;height:4px;background:linear-gradient(90deg,var(--emerald),var(--gold-soft),var(--emerald))}
.ch-head{text-align:center;padding-bottom:16px;margin-bottom:20px;border-bottom:1px solid var(--line);position:relative}
.ch-num{font-family:var(--font-ui);font-size:.7rem;letter-spacing:2px;color:var(--gold);display:block;margin-bottom:6px}
.ch-title{font-family:var(--font-d);font-size:clamp(1.4rem,3.6vw,1.95rem);line-height:1.6;color:var(--emerald)}
html[data-theme="dark"] .ch-title{color:var(--gold-soft)}
.ch-word{font-family:var(--font-ui);font-size:.66rem;color:var(--ink-mute);margin-top:6px}
.ch-actions{display:flex;gap:6px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.act{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg2);color:var(--ink-soft);font-family:var(--font-ui);font-size:.7rem;transition:.18s}
.act:hover{border-color:var(--gold);color:var(--gold)}
.act.on{background:var(--gold);color:#fff;border-color:var(--gold)}
.body p{margin:0 0 1.05em;text-align:justify;text-justify:inter-word;word-spacing:.04em}
.sub-h{font-family:var(--font-d);font-size:1.25rem;color:var(--emerald);margin:26px 0 12px;display:flex;align-items:center;gap:8px;line-height:1.6}
.sub-h::before{content:"❁";color:var(--gold);font-size:.9rem}
html[data-theme="dark"] .sub-h{color:var(--gold-soft)}
.verse,.quote{font-family:var(--font-q);font-size:1.08em;color:var(--emerald);background:linear-gradient(135deg,rgba(15,93,67,.06),rgba(201,162,39,.09));border-right:3px solid var(--emerald);border-left:3px solid var(--gold-soft);padding:14px 18px;margin:18px 0;border-radius:12px}
html[data-theme="dark"] .verse,html[data-theme="dark"] .quote{background:linear-gradient(135deg,rgba(90,214,164,.08),rgba(232,194,96,.08))}
.note{background:rgba(201,162,39,.10);border:1px dashed var(--gold-line);border-radius:12px;padding:12px 16px;margin:14px 0;font-size:.96em;color:var(--ink-soft)}
.list-block{list-style:none;margin:0 0 16px;padding:0}
.list-block li{position:relative;padding:6px 26px 6px 0;line-height:1.95}
.list-block li::before{content:"✦";position:absolute;right:4px;top:8px;color:var(--gold);font-size:.8rem}
/* سؤال وجواب */
.qa-q{display:flex;gap:10px;align-items:flex-start;font-weight:700;color:var(--emerald);font-size:1.05em;margin:26px 0 8px;line-height:1.9}
html[data-theme="dark"] .qa-q{color:var(--gold-soft)}
.qa-q .qn{flex:0 0 26px;height:26px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,var(--emerald),var(--emerald-2));color:#fff;font-family:var(--font-ui);font-size:.75rem;margin-top:3px}
.qa-a{padding-right:36px}
.qa-a p{margin:0 0 .8em;text-align:justify}
.dalil{position:relative;margin:10px 0 4px 36px;padding:10px 14px;border-radius:10px;background:linear-gradient(135deg,rgba(201,162,39,.13),rgba(201,162,39,.04));border-right:3px solid var(--gold-soft);font-family:var(--font-q);font-size:.98em;color:var(--ink-soft)}
.dalil::before{content:"الدليل";position:absolute;top:-9px;right:10px;font-family:var(--font-ui);font-size:.6rem;color:#fff;background:var(--gold);padding:1px 8px;border-radius:8px}
.end-orn{text-align:center;color:var(--gold);letter-spacing:8px;margin-top:22px;padding-top:14px;border-top:1px dashed var(--line);font-size:.9rem}
.nav-ch{display:flex;gap:10px;max-width:860px;margin:0 auto}
.nav-ch button{flex:1;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--paper);font-family:var(--font-ui);font-size:.8rem;color:var(--ink-soft);transition:.2s;display:flex;flex-direction:column;gap:3px}
.nav-ch button:hover:not(:disabled){border-color:var(--gold);color:var(--gold);transform:translateY(-2px);box-shadow:var(--shadow)}
.nav-ch button:disabled{opacity:.35;cursor:not-allowed}
.nav-ch small{font-size:.64rem;color:var(--ink-mute)}
.panel{position:fixed;inset:0;z-index:70;display:none;align-items:flex-start;justify-content:center;background:rgba(20,14,4,.45);backdrop-filter:blur(5px);padding:70px 14px 20px;overflow-y:auto}
.panel.on{display:flex}
.panel-card{width:min(760px,100%);background:var(--paper);border:1px solid var(--gold-line);border-radius:20px;box-shadow:var(--shadow-lg);padding:16px}
.panel-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.panel-head h4{font-family:var(--font-d);font-size:1.05rem;color:var(--emerald);flex:1}
html[data-theme="dark"] .panel-head h4{color:var(--gold)}
.search-input{width:100%;padding:12px 16px;border-radius:14px;border:1px solid var(--line);background:var(--bg2);color:var(--ink);font-family:var(--font-b);font-size:.95rem}
.res{max-height:min(60vh,520px);overflow-y:auto;margin-top:12px}
.res-item{padding:11px 13px;border-radius:12px;border:1px solid transparent;cursor:pointer;transition:.15s}
.res-item:hover{background:var(--bg2);border-color:var(--line)}
.res-item b{display:block;font-family:var(--font-ui);font-size:.82rem;color:var(--emerald);margin-bottom:3px}
html[data-theme="dark"] .res-item b{color:var(--gold-soft)}
.res-item span{font-size:.82rem;color:var(--ink-soft);line-height:1.8;display:block}
.res-item mark{background:rgba(201,162,39,.32);color:inherit;border-radius:3px;padding:0 1px}
.hint{font-family:var(--font-ui);font-size:.75rem;color:var(--ink-mute);text-align:center;padding:14px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line);font-family:var(--font-ui);font-size:.85rem}
.set-row:last-child{border:0}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);font-size:1.05rem;color:var(--ink-soft)}
.stepper button:hover{background:var(--gold);color:#fff;border-color:var(--gold)}
.stepper b{min-width:52px;text-align:center;font-family:var(--font-ui);font-size:.82rem;color:var(--gold)}
.morph{position:relative;width:44px;height:44px;flex:0 0 44px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 32% 28%,#fff9e6,#f2d98a 60%,#d9b95c);border:1px solid rgba(163,120,19,.5);box-shadow:0 6px 18px rgba(163,120,19,.25),inset 0 0 12px rgba(255,255,255,.6);overflow:hidden;transition:background .45s;cursor:pointer}
html[data-theme="dark"] .morph{background:radial-gradient(circle at 32% 28%,#2c3a58,#15213a 60%,#0a1222);box-shadow:0 6px 20px rgba(0,0,0,.5),inset 0 0 14px rgba(120,150,220,.18);border-color:rgba(232,194,96,.45)}
.morph svg{position:absolute;width:22px;height:22px;transition:transform .5s cubic-bezier(.4,0,.2,1),opacity .35s}
.morph .sun{color:#a37813;transform:translateY(0)}
.morph .moon{color:#ffe9a8;transform:translateY(140%) rotate(-40deg);opacity:0}
html[data-theme="dark"] .morph .sun{transform:translateY(-140%) rotate(40deg);opacity:0}
html[data-theme="dark"] .morph .moon{transform:translateY(0) rotate(0);opacity:1}
#toast{position:fixed;bottom:26px;left:50%;transform:translate(-50%,20px);z-index:90;background:var(--emerald);color:#fff;padding:9px 20px;border-radius:999px;font-family:var(--font-ui);font-size:.78rem;opacity:0;pointer-events:none;transition:.3s;box-shadow:var(--shadow-lg)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toTop{position:fixed;bottom:22px;left:22px;z-index:55;width:46px;height:46px;border-radius:50%;background:var(--paper);border:1px solid var(--gold-line);color:var(--gold);display:grid;place-items:center;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.25s}
#toTop.on{opacity:1;pointer-events:auto}
#toTop:hover{background:var(--gold);color:#fff}
#loader{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:200;color:var(--gold);font-family:var(--font-d);font-size:1.2rem}
#loader.off{display:none}
@media (max-width:1024px){
  aside{position:fixed;top:0;right:-100%;height:100vh;width:min(330px,88vw);z-index:80;transition:right .3s;border-left:1px solid var(--line);box-shadow:var(--shadow-lg)}
  aside.open{right:0}
  main{padding:16px 12px 90px}
  .chapter{padding:20px 16px}
}
@media (max-width:560px){
  body{--fs:18px}
  .brand span{display:none}
  .hbtn span.lbl{display:none}
  .hbtn{padding:0;width:38px}
  .meta{flex:1 1 44%}
  .qa-a{padding-right:0}
  .dalil{margin-left:0}
}
@media print{
  header,aside,#toTop,.ch-actions,.nav-ch,.panel,#bar,#loader{display:none!important}
  body{background:#fff;color:#000;--fs:14pt}
  main{padding:0}
  .chapter{box-shadow:none;border:0;page-break-inside:avoid;max-width:100%}
  #reader{display:block!important}
  #cover{display:none!important}
}

/* تحسين وضوح الذهبي في الوضع النهاري */
html[data-mode="light"]{--gold:#8a6408;--gold-soft:#b8860b}
html[data-mode="light"] .meta b,
html[data-mode="light"] .cover-author,
html[data-mode="light"] .price,
html[data-mode="light"] .gold{color:#8a6408}
</style>
<script src="./rafiq-3d.js"></script><script src="./rafiq-daily-notifications.js"></script>
</head>
<body>
<div id="loader">جارٍ تجهيز الكتاب…</div>
<div id="bar"><div id="barFill"></div></div>
<header>
  <button class="hbtn" onclick="goHome()" title="العودة إلى رفيق المسلم">
    <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
    <span class="lbl">الرئيسية</span>
  </button>
  <button class="hbtn icon" onclick="toggleAside()" title="الفهرس" aria-label="الفهرس">
    <svg viewBox="0 0 24 24"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="14" y2="18"/></svg>
  </button>

<script>
(function(){
  'use strict';
  var $=function(s,r){return (r||document).querySelector(s)};
  var WHICH=(function(){try{return (new URLSearchParams(location.search).get('book')||'seerah').toLowerCase()}catch(e){return 'seerah'}})();
  var BOOKS={
    seerah:{title:'السيرة النبوية',sub:'سيرة النبي محمد ﷺ كاملة من «البداية والنهاية» لابن كثير',files:['seerah-book.js'],global:'RFQ_SEERAH_BOOK',kind:'raw',
      note:'النص الكامل لأبواب السيرة النبوية كما سردها الحافظ ابن كثير: المولد والنسب، البعثة والدعوة، الهجرة والغزوات، الوفود وحجة الوداع والوفاة. مرتبة على أبواب الكتاب ومجلداته.'},
    fiqh:{title:'الفقه الميسّر',sub:'أحكام العبادات والمعاملات بالأدلة المختصرة',files:['ilm-fiqh.js','fiqh-extra.js'],global:'ILM_FIQH',kind:'fiqh',
      note:'عشرة أبواب و٩٧ مسألة في العبادات والمعاملات والنكاح والمواريث والجنايات، بصيغة سؤال وجواب على ما عليه جمهور أهل العلم، مع الدليل المختصر.'}
  };
  var CFG=BOOKS[WHICH]||BOOKS.seerah;
  var CH=[], S={ch:0, fs:20, lh:20, bm:[], done:[]}, LS='rfqbook_'+WHICH;

  function num(n){return String(n).replace(/\d/g,function(d){return '٠١٢٣٤٥٦٧٨٩'[+d]})}
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
  function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('on')},1600)}
  function cleanHtml(h){return String(h||'').replace(/<script[\s\S]*?<\/script>/gi,'').replace(/ on\w+="[^"]*"/gi,'').replace(/javascript:/gi,'')}
  function wordsOf(blocks){var n=0;blocks.forEach(function(b){var t='';if(b.items)t=b.items.join(' ');else t=(b.v||b.q||b.a||b.dalil||'');n+=String(t).replace(/<[^>]+>/g,' ').split(/\s+/).filter(Boolean).length});return n}

  /* ---- بناء الكتاب من بيانات المكتبة ---- */
  function buildSeerah(d){
    var out=[];
    (d.stations||[]).forEach(function(st){
      var blocks=[];
      if(st.sub) blocks.push({t:'note',v:st.sub});
      (st.blocks||[]).forEach(function(b){blocks.push(b)});
      out.push({title:st.title,badge:st.stage||'',blocks:blocks,words:wordsOf(blocks)});
    });
    var extra=[
      {title:'شمائله ﷺ وأخلاقه',badge:'خاتمة',blocks:[
        {t:'p',v:'كان النبي ﷺ أحسن الناس خَلقًا وخُلقًا، وصفه الله تعالى بقوله: ﴿وَإِنَّكَ لَعَلَىٰ خُلُقٍ عَظِيمٍ﴾. وكان أشد الناس تواضعًا، يخدم في بيته، ويجيب دعوة الفقير، ويبدأ من لقيه بالسلام، ولا يأنف أن يمشي مع الأرملة والمسكين في حاجتهما.'},
        {t:'p',v:'وكان أشد الناس رحمةً بالصغار والضعفاء والحيوان، وأشدهم حياءً، كان إذا كره شيئًا عُرف في وجهه، وكان يُكثر ذكر الله، ويقوم من الليل حتى تتفطر قدماه، ويقول: «أفلا أرغب أن أكون عبدًا شكورًا».'},
        {t:'h',v:'من صفاته الخَلقية'},
        {t:'p',v:'كان مربوع القامة، أزهر اللون، شديد السواد في الشعر واللحية، ضخم الكفين والقدمين، كث اللحية، في لحيته سبع عشرة شيبة، وكان خاتم النبوة بين كتفيه، طيّب الرائحة حتى إن من سلك طريقًا بعده عرف أنه سلكه من طيب عرقه.'},
        {t:'quote',v:'قال أنس بن مالك رضي الله عنه: «خدمتُ النبي ﷺ عشر سنين، فوالله ما قال لي أفٍّ قط، ولا قال لشيءٍ فعلتُه: لِمَ فعلتَه؟ ولا لشيءٍ لم أفعلْه: ألا فعلتَه؟» — متفق عليه.'},
        {t:'note',v:'الدروس: الرحمة والحياء والصدق والتواضع والعمل في خدمة النفس؛ فالكبير لا يَعِيبُه أن يخدم أهله.'}
      ]},
      {title:'أزواجه وأولاده',badge:'خاتمة',blocks:[
        {t:'p',v:'تزوّج النبي ﷺ إحدى عشرة امرأة، كلُّهنّ أمهات المؤمنين رضي الله عنهنّ، ومنهنّ: خديجة بنت خويلد، وسودة بنت زمعة، وعائشة بنت أبي بكر، وحفصة بنت عمر، وزينب بنت خزيمة، وأم سلمة هند بنت أبي أمية، وزينب بنت جحش، وجويرية بنت الحارث، وصفية بنت حيي، وميمونة بنت الحارث، وأم حبيبة رملة بنت أبي سفيان.'},
        {t:'p',v:'وأولاده: القاسم، وعبد الله (الطاهر أو الطيب)، وإبراهيم، وأمه مارية القبطية، وبنتاه: زينب، ورقية، وأم كلثوم، وفاطمة الزهراء رضي الله عنها، وجميع أولاده من خديجة إلا إبراهيم.'},
        {t:'p',v:'وكان ﷺ عظيم الرعاية لهنّ، يُساوي بينهنّ في النفقة والقَسْم، ويقول: «خيرُكم خيرُكم لأهله»، وأوصى ﷺ بأهل بيته خيرًا، وقال في فاطمة: «فاطمة بَضْعة منّي، يُريبُني ما أرابها».'},
        {t:'note',v:'الدروس: الرحمة الأسرية، والعدل بين الأزواج، والحفاظ على صلة الأهل والأبناء.'}
      ]},
      {title:'أصحابه وخاصة أهل بيته',badge:'خاتمة',blocks:[
        {t:'p',v:'تربّى على يده ﷺ جيلٌ فريد نقل الدين كاملًا: أبو بكر الصديق، وعمر الفاروق، وعثمان ذو النورين، وعلي بن أبي طالب، وطلحة والزبير وسعد وسعيد وعبد الرحمن بن عوف وأبو عبيدة، وأهل الصفة، والنساء الأوائل: خديجة وعائشة وفاطمة، وسُمّوا «السابقون الأولون».'},
        {t:'p',v:'وقد زكّاهم الله تعالى في كتابه: ﴿وَالسَّابِقُونَ الْأَوَّلُونَ مِنَ الْمُهَاجِرِينَ وَالْأَنصَارِ وَالَّذِينَ اتَّبَعُوهُم بِإِحْسَانٍ رَّضِيَ اللَّهُ عَنْهُمْ وَرَضُوا عَنْهُ﴾، وقال ﷺ: «لا تسبّوا أصحابي؛ فلو أنَّ أحدكم أنفق مثل أُحدٍ ذهبًا ما بلغ مُدَّ أحدهم».'},
        {t:'note',v:'الدروس: محبتهم واقتفاء أثرهم، وسلامة القلب تجاههم، والاقتداء بعلمائهم.'}
      ]},
      {title:'دلائل نبوّته ﷺ',badge:'خاتمة',blocks:[
        {t:'p',v:'أعظم دلائل نبوّته القرآن الكريم، المعجز في نظمه ومعناه وصدق أخباره، ثم ما شهدته كتب أهل الكتاب من صفته، ثم الآيات التي أجريت على يديه: انشقاق القمر، ونبع الماء من بين أصابعه، وتكثير الطعام، وحنين الجذع، وإخباره بالمغيبات التي وقعت كما أخبر.'},
        {t:'quote',v:'قال جابر بن عبدالله رضي الله عنه: «عطش الناس يوم الحديبية، فتوضأ النبي ﷺ، ثم دعا، فجعل الماء يثور من بين أصابعه، فشرب الناس وتوضّئوا» — رواه البخاري.'},
        {t:'note',v:'الدروس: تصديق النبي ﷺ فيما أخبر، والاعتصام بسنته، وتقديم الوحي على الهوى.'}
      ]}
    ];
    extra.forEach(function(c){out.push({title:c.title,badge:c.badge,blocks:c.blocks,words:wordsOf(c.blocks)})});
    return {intro:d.intro||'',chapters:out,note:CFG.note};
  }
  function buildFiqh(d){
    var out=[];
    (d.chapters||[]).forEach(function(c){
      var blocks=[];
      if(c.sub) blocks.push({t:'note',v:c.sub});
      (c.qa||[]).forEach(function(x){
        blocks.push({t:'q',v:x.q});
        if(x.a) blocks.push({t:'a',v:x.a});
        if(x.dalil) blocks.push({t:'dalil',v:x.dalil});
      });
      out.push({title:c.title,badge:'',blocks:blocks,words:wordsOf(blocks)});
    });
    return {intro:d.intro||'',chapters:out,note:CFG.note};
  }

  function loadScripts(list,done){
    var i=0;
    (function next(){
      if(i>=list.length)return done();
      var s=document.createElement('script');
      s.src=list[i++];
      s.onload=next;
      s.onerror=function(){$('#loader').textContent='تعذّر تحميل بيانات الكتاب'};
      document.body.appendChild(s);
    })();
  }
  function buildRaw(d){
    var out=[];
    (d.chapters||[]).forEach(function(c){
      var blocks=(c.text||[]).map(function(p){return {t:'p',v:p}});
      out.push({title:c.title,part:c.part||'',badge:'',blocks:blocks,words:c.words||wordsOf(blocks)});
    });
    return {intro:d.intro||'',chapters:out,note:CFG.note,author:d.author||'',source:d.source||''};
  }
  function boot(){
    var files=CFG.files||[CFG.file];
    loadScripts(files,function(){
      var raw=window[CFG.global];
      if(!raw){$('#loader').textContent='تعذّر تحميل الكتاب';return}
      if(CFG.kind==='fiqh'&&window.RFQ_FIQH_EXTRA&&window.RFQ_FIQH_EXTRA.chapters){
        var base={};(raw.chapters||[]).forEach(function(c){base[c.title.replace(/\s*—\s*تكملة$/,'')]=c});
        (raw.chapters||[]).concat(window.RFQ_FIQH_EXTRA.chapters).forEach(function(c){
          var key=c.title.replace(/\s*—\s*تكملة$/,'');
          if(!base[key]){base[key]={title:key,icon:c.icon,sub:c.sub,qa:[]}}
          if(base[key].qa!==c.qa)base[key].qa=base[key].qa.concat(c.qa||[]);
          
        });
        raw.chapters=Object.keys(base).map(function(k){var c=base[k];if(!c.qa)c.qa=[];return c});
      }
      var built=CFG.kind==='fiqh'?buildFiqh(raw):(CFG.kind==='raw'?buildRaw(raw):buildSeerah(raw));
      CH=built.chapters.filter(function(c){return (c.words||0)>3});
      CH.forEach(function(c,i){c.id=WHICH+'-'+i});
      window.RFQ_CHAPTERS=CH;
      $('#cvTitle').textContent=CFG.title;
      $('#brandTitle').textContent=CFG.title;
      $('#cvSub').textContent=CFG.sub;
      $('#brandSub').textContent=CFG.kind==='fiqh'?'الفقه الميسّر':'السيرة النبوية';
      $('#cvNote').textContent=built.note;
      if($('#cvAuthor'))$('#cvAuthor').textContent=built.author?('المؤلف: '+built.author):'';
      if($('#cvSource'))$('#cvSource').textContent=built.source||'';
      document.title=CFG.title+' · رفيق المسلم';
      load(); render(); $('#loader').classList.add('off'); window.bookReady=true;
    });
  }

  /* ---- حالة القراءة ---- */
  function load(){
    try{var o=JSON.parse(localStorage.getItem(LS)||'{}');for(var k in o)S[k]=o[k]}catch(e){}
    if(!Array.isArray(S.bm))S.bm=[];
    if(!Array.isArray(S.done))S.done=[];
    if(typeof S.fs!=='number')S.fs=20;
    if(typeof S.lh!=='number')S.lh=20;
    if(S.ch<0||S.ch>=CH.length)S.ch=0;
  }
  function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}

  /* ---- الثيم ---- */
  function setTheme(mode,quiet,persist){
    document.documentElement.setAttribute('data-theme',mode==='dark'?'dark':'');
    document.documentElement.setAttribute('data-mode',mode);
    var meta=document.querySelector('meta[name="theme-color"]');
    if(meta)meta.setAttribute('content',mode==='dark'?'#080e1a':'#fbf7ef');
    if(persist){try{localStorage.setItem('rm_theme',mode)}catch(e){}}
    if(!quiet)toast(mode==='dark'?'🌙 الوضع الليلي':'☀️ الوضع النهاري');
  }
  function toggleTheme(){setTheme(document.documentElement.getAttribute('data-mode')==='dark'?'light':'dark',false,true)}
  window.toggleTheme=toggleTheme;
  setTheme(document.documentElement.getAttribute('data-mode')==='dark'?'dark':'light',true);
  window.addEventListener('storage',function(e){if(e.key==='rm_theme'&&e.newValue)setTheme(e.newValue==='dark'?'dark':'light',true)});
  window.addEventListener('message',function(e){var d=e.data||{};if(d&&d.type==='rafiq:theme')setTheme(d.mode==='dark'?'dark':'light',true)});

  function goHome(){
    if(window.parent&&window.parent!==window){try{window.parent.postMessage('book:close','*');return}catch(e){}}
    location.href='index.html';
  }
  window.goHome=goHome;

  /* ---- الفهرس ---- */
  function render(){
    var box=$('#chapters'),lastPart='';
    box.innerHTML=CH.map(function(c,i){
      var head='';
      if(c.part&&c.part!==lastPart){lastPart=c.part;head='<div class="part-title">'+esc(c.part)+'</div>'}
      return head+'<div class="ch'+(i===S.ch?' active':'')+(S.done.indexOf(i)>-1?' done':'')+'" data-i="'+i+'" onclick="openChapter('+i+')"><i>'+(i+1)+'</i><b>'+esc(c.title)+'</b></div>';
    }).join('');
    $('#idxCount').textContent=CH.length+' بابًا';
    var w=CH.reduce(function(a,c){return a+(c.words||0)},0);
    $('#mtCh').textContent=num(CH.length);
    $('#mtWords').textContent=num(w>=1000?Math.round(w/1000)+' ألف':w);
    var mins=Math.max(1,Math.round(w/180));
    if(mins>=180){$('#mtTime').textContent=num(Math.round(mins/60));if($('#mtTimeUnit'))$('#mtTimeUnit').textContent='ساعة قراءة';}
    else{$('#mtTime').textContent=num(mins);if($('#mtTimeUnit'))$('#mtTimeUnit').textContent='دقيقة قراءة';}
    if(S.done.length)$('#ctaLabel').textContent='أكمل من الباب '+num(S.ch+1);
    applyFs();
  }
  function filterIndex(q){q=(q||'').trim();document.querySelectorAll('#chapters .ch').forEach(function(el){var i=+el.getAttribute('data-i');el.style.display=(!q||CH[i].title.indexOf(q)>-1)?'':'none'})}
  window.filterIndex=filterIndex;

  function blockHtml(b){
    if(b.t==='h') return '<h3 class="sub-h">'+esc(b.v)+'</h3>';
    if(b.t==='quote') return '<div class="quote">'+esc(b.v)+'</div>';
    if(b.t==='note') return '<div class="note">'+esc(b.v)+'</div>';
    if(b.t==='list') return '<ul class="list-block">'+(b.items||[]).map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>';
    if(b.t==='q') return '<div class="qa-q"><span class="qn">س</span><span>'+esc(b.v)+'</span></div>';
    if(b.t==='a') return '<div class="qa-a">'+cleanHtml(b.v)+'</div>';
    if(b.t==='dalil') return '<div class="dalil">'+cleanHtml(b.v)+'</div>';
    return '<p>'+cleanHtml(b.v)+'</p>';
  }
  function renderChapter(i){
    var c=CH[i];if(!c)return;
    var box=$('#chapterBox');
    box.innerHTML='<div class="ch-head"><span class="ch-num">'+(c.badge?esc(c.badge)+' · ':'')+'الباب '+num(i+1)+' من '+num(CH.length)+'</span>'+
      '<h2 class="ch-title">'+esc(c.title)+'</h2><div class="ch-word">'+num(c.words||0)+' كلمة تقريبًا</div>'+
      '<div class="ch-actions"><button class="act'+(S.bm.indexOf(i)>-1?' on':'')+'" onclick="toggleBm('+i+')">🔖 '+(S.bm.indexOf(i)>-1?'محفوظ':'علامة')+'</button>'+
      '<button class="act" onclick="copyChapter('+i+')">📋 نسخ</button>'+
      '<button class="act'+(S.done.indexOf(i)>-1?' on':'')+'" onclick="markDone('+i+')">✓ '+(S.done.indexOf(i)>-1?'تمت قراءته':'تحديد كمقروء')+'</button></div></div>'+
      '<div class="body">'+c.blocks.map(blockHtml).join('')+'</div><div class="end-orn">۞ ۞ ۞</div>';
    $('#prevTitle').textContent=i>0?CH[i-1].title.slice(0,40):'—';
    $('#nextTitle').textContent=i<CH.length-1?CH[i+1].title.slice(0,40):'—';
    $('#prevBtn').disabled=i<=0;$('#nextBtn').disabled=i>=CH.length-1;
    document.querySelectorAll('#chapters .ch').forEach(function(el){var j=+el.getAttribute('data-i');el.classList.toggle('active',j===i);el.classList.toggle('done',S.done.indexOf(j)>-1)});
    document.title=c.title+' · '+CFG.title;
    document.querySelectorAll('.panel.on').forEach(function(p){p.classList.remove('on')});
    if(matchMedia('(max-width:1024px)').matches)$('#aside').classList.remove('open');
    scrollTo({top:0,behavior:'auto'});
    setTimeout(function(){var a=document.querySelector('#chapters .ch.active');if(a&&a.scrollIntoView)a.scrollIntoView({block:'nearest'})},60);
  }
  function openChapter(i){S.ch=i;save();startReader();renderChapter(i)}
  window.openChapter=openChapter;
  function step(d){var n=S.ch+d;if(n>=0&&n<CH.length)openChapter(n)}
  window.step=step;
  function startReader(){$('#cover').style.display='none';$('#reader').classList.add('on');applyFs();}
  window.startReader=startReader;
  function showCover(){$('#reader').classList.remove('on');$('#cover').style.display='';document.title=CFG.title+' · رفيق المسلم';scrollTo({top:0,behavior:'smooth'})}
  window.showCover=showCover;
  function continueReading(){openChapter(S.ch||0)}
  window.continueReading=continueReading;

  function toggleBm(i){var k=S.bm.indexOf(i);if(k>-1){S.bm.splice(k,1);toast('أُزيلت العلامة')}else{S.bm.push(i);toast('🔖 حُفظت العلامة')}save();renderChapter(i)}
  window.toggleBm=toggleBm;
  function markDone(i){var k=S.done.indexOf(i);if(k>-1)S.done.splice(k,1);else S.done.push(i);save();renderChapter(i)}
  window.markDone=markDone;
  function copyChapter(i){
    var c=CH[i];
    var tmp=document.createElement('div');tmp.innerHTML=c.blocks.map(blockHtml).join('');
    var txt=c.title+'\n\n'+tmp.textContent.replace(/\n{3,}/g,'\n\n').trim()+'\n\n— '+CFG.title;
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(function(){toast('📋 نُسخ الباب')},function(){toast('تعذّر النسخ')});
  }
  window.copyChapter=copyChapter;

  function openPanel(id){var p=document.getElementById(id);if(!p)return;p.classList.add('on');if(id==='searchPanel')setTimeout(function(){$('#searchInput').focus()},80);if(id==='bookmarkPanel')renderBm()}
  function closePanel(id){var p=document.getElementById(id);if(p)p.classList.remove('on')}
  window.openPanel=openPanel;window.closePanel=closePanel;
  document.querySelectorAll('.panel').forEach(function(p){p.addEventListener('click',function(e){if(e.target===p)p.classList.remove('on')})});
  function renderBm(){
    var box=$('#bmRes');
    if(!S.bm.length){box.innerHTML='<div class="hint">لا توجد علامات بعد.</div>';return}
    box.innerHTML=S.bm.slice().sort(function(a,b){return a-b}).map(function(i){
      return '<div class="res-item" onclick="closePanel(\'bookmarkPanel\');openChapter('+i+')"><b>الباب '+(i+1)+'</b><span>'+esc(CH[i].title)+'</span></div>';
    }).join('');
  }

  var tmr=null;
  function doSearch(q){clearTimeout(tmr);tmr=setTimeout(function(){runSearch(q)},180)}
  window.doSearch=doSearch;
  function plain(b){
    b=b||{};
    if(b.items)return b.items.join(' — ');
    return String(b.v||b.q||b.a||b.dalil||'').replace(/<[^>]+>/g,' ');
  }
  function runSearch(q){
    q=(q||'').trim();var box=$('#searchRes');
    if(q.length<2){box.innerHTML='<div class="hint">اكتب حرفين على الأقل.</div>';return}
    var res=[];
    for(var i=0;i<CH.length&&res.length<60;i++){
      var t=CH[i].title;
      if(t.indexOf(q)>-1)res.push({i:i,title:'عنوان الباب',snip:esc(t)});
      var bl=CH[i].blocks;
      for(var b=0;b<bl.length;b++){
        var txt=plain(bl[b]),pos=txt.indexOf(q);
        if(pos>-1){
          var st=Math.max(0,pos-70),en=Math.min(txt.length,pos+q.length+110);
          var snip=esc((st>0?'… ':'')+txt.slice(st,en)+' …').replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g'),'<mark>'+esc(q)+'</mark>');
          res.push({i:i,title:CH[i].title,snip:snip});break;
        }
      }
    }
    if(!res.length){box.innerHTML='<div class="hint">لا نتائج لـ «'+esc(q)+'»</div>';return}
    box.innerHTML=res.map(function(r){return '<div class="res-item" onclick="closePanel(\'searchPanel\');openChapter('+r.i+')"><b>'+esc(r.title)+'</b><span>'+r.snip+'</span></div>'}).join('');
  }

  function applyFs(){
    document.documentElement.style.setProperty('--fs',S.fs+'px');
    document.documentElement.style.setProperty('--lh',(S.lh/10));
    var f=$('#fsVal'),l=$('#lhVal');if(f)f.textContent=S.fs;if(l)l.textContent=(S.lh/10).toFixed(1);
  }
  function setFs(d){S.fs=Math.max(16,Math.min(30,S.fs+d));save();applyFs()}
  function setLh(d){S.lh=Math.max(15,Math.min(26,S.lh+d));save();applyFs()}
  window.setFs=setFs;window.setLh=setLh;
  function toggleAside(force){var a=$('#aside');if(force===true)a.classList.add('open');else if(force===false)a.classList.remove('open');else a.classList.toggle('open')}
  window.toggleAside=toggleAside;

  function onScroll(){
    var h=document.documentElement,max=(h.scrollHeight-h.clientHeight)||1;
    $('#barFill').style.width=Math.min(100,Math.max(0,h.scrollTop/max*100))+'%';
    $('#toTop').classList.toggle('on',h.scrollTop>500);
  }
  addEventListener('scroll',onScroll,{passive:true});
  document.addEventListener('keydown',function(e){
    if(e.target&&/INPUT|TEXTAREA/.test(e.target.tagName))return;
    if(e.key==='Escape')document.querySelectorAll('.panel.on').forEach(function(p){p.classList.remove('on')});
    if($('#reader').classList.contains('on')){
      if(e.key==='ArrowLeft')step(1);
      if(e.key==='ArrowRight')step(-1);
      if(e.key==='/'){e.preventDefault();openPanel('searchPanel')}
    }
  });
  boot();onScroll();
})();
</script>
</body>
</html>
